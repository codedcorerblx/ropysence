[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ropysence"
version = "1.3.0"
description = "Custom Discord Rich Presence that mirrors your live Roblox status"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "websockets",
    "cryptography",
    "keyring",
]

[project.scripts]
ropysence = "src.ropysence.app:main"

[tool.setuptools]
packages = ["src", "src.ropysence", "src.ropysence.core", "src.ropysence.discord", "src.ropysence.roblox", "src.ropysence.workers"]
